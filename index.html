<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Service Request System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>ICT Service Request System</h1>
            <button id="logout-btn" class="btn btn-secondary">Logout</button>
        </div>
    </header>

    <div class="container">
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <section class="dashboard">
            <div class="stat-card">
                <h3 id="total-requests">0</h3>
                <p>Total Requests</p>
            </div>
            <div class="stat-card">
                <h3 id="pending-requests">0</h3>
                <p>Pending</p>
            </div>
            <div class="stat-card">
                <h3 id="inprogress-requests">0</h3>
                <p>In Progress</p>
            </div>
            <div class="stat-card">
                <h3 id="completed-requests">0</h3>
                <p>Completed</p>
            </div>
        </section>

        <section class="controls">
            <button id="new-request-btn" class="btn btn-primary">New Request</button>
            <input type="text" id="search-input" placeholder="Search by requester name or description...">
            <select id="status-filter">
                <option value="All">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
            <select id="priority-filter">
                <option value="All">All Priorities</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
        </section>

        <section class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Requester</th>
                        <th>Department</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Date Requested</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="requests-tbody">
                </tbody>
            </table>
        </section>
    </div>

    <div id="request-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">New Request</h2>
                <button class="close" id="close-modal">&times;</button>
            </div>
            <form id="request-form">
                <div class="form-group">
                    <label for="requester-name">Requester Name</label>
                    <input type="text" id="requester-name" required>
                    <div id="error-requester-name" class="error"></div>
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" required>
                    <div id="error-department" class="error"></div>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select category</option>
                        <option value="Computer Repair">Computer Repair</option>
                        <option value="Software Installation">Software Installation</option>
                        <option value="Internet/Network Problem">Internet/Network Problem</option>
                        <option value="Printer Problem">Printer Problem</option>
                        <option value="Account/Access Concern">Account/Access Concern</option>
                        <option value="Other">Other ICT-related Concern</option>
                    </select>
                    <div id="error-category" class="error"></div>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" required></textarea>
                    <div id="error-description" class="error"></div>
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" required>
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                    <div id="error-priority" class="error"></div>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" required>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                    <div id="error-status" class="error"></div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Request</button>
                </div>
            </form>
        </div>
    </div>

    <div id="delete-modal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h2>Confirm Delete</h2>
            <p style="margin: 20px 0;">Are you sure you want to delete this request? This action cannot be undone.</p>
            <div class="form-actions" style="justify-content: center;">
                <button class="btn btn-secondary" onclick="document.getElementById('delete-modal').classList.remove('active')">Cancel</button>
                <button id="confirm-delete-btn" class="btn btn-danger">Delete</button>
            </div>
            <input type="hidden" id="delete-id" value="">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
