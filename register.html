<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ICT Service Request System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>ICT Service Request System</h2>
        <p style="text-align:center; color:#666; margin-bottom:15px;">Create an account to continue</p>
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        <form id="register-form">
            <div class="form-group">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" required autocomplete="name">
                <div id="error-full-name" class="error"></div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email">
                <div id="error-email" class="error"></div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="new-password" minlength="6">
                <div id="error-password" class="error"></div>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" required autocomplete="new-password" minlength="6">
                <div id="error-confirm-password" class="error"></div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Register</button>
        </form>
        <p style="text-align:center; margin-top:15px; font-size:0.9rem;">
            Already have an account? <a href="login.html" style="color:#3498db;">Login here</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearErrors();
            document.getElementById('error-message').classList.remove('active');
            document.getElementById('success-message').classList.remove('active');

            const fullName = document.getElementById('full-name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            let isValid = true;

            if (!fullName) {
                showError('error-full-name', 'Full name is required.');
                isValid = false;
            }

            if (!email) {
                showError('error-email', 'Email is required.');
                isValid = false;
            }

            if (!password || password.length < 6) {
                showError('error-password', 'Password must be at least 6 characters.');
                isValid = false;
            }

            if (password !== confirmPassword) {
                showError('error-confirm-password', 'Passwords do not match.');
                isValid = false;
            }

            if (!isValid) return;

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName
                        }
                    }
                });

                if (error) {
                    showErrorBanner(error.message || 'Registration failed. Please try again.');
                    return;
                }

                if (data.user && data.user.identities && data.user.identities.length === 0) {
                    showErrorBanner('This email is already registered. Please login instead.');
                    return;
                }

                showSuccessBanner('Registration successful! You can now login.');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (err) {
                const msg = err && err.message ? err.message : 'An unexpected error occurred. Please try again later.';
                showErrorBanner('Error: ' + msg);
                console.error(err);
            }
        });

        function clearErrors() {
            document.querySelectorAll('.error').forEach(el => el.textContent = '');
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            if (el) el.textContent = message;
        }

        function showErrorBanner(message) {
            const el = document.getElementById('error-message');
            el.textContent = message;
            el.classList.add('active');
        }

        function showSuccessBanner(message) {
            const el = document.getElementById('success-message');
            el.textContent = message;
            el.classList.add('active');
        }
    </script>
</body>
</html>
